name: Publish WinGet

on:
  workflow_call:
    inputs:
      plan:
        description: cargo-dist release plan
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Submit ttrackii.ttrackii
    if: ${{ !fromJSON(inputs.plan).announcement_is_prerelease }}
    runs-on: windows-2022
    environment: winget
    env:
      DIST_PLAN: ${{ inputs.plan }}
      PACKAGE_IDENTIFIER: ttrackii.ttrackii
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
      WINGETCREATE_URL: https://github.com/microsoft/winget-create/releases/download/v1.12.8.0/wingetcreate.exe
      WINGETCREATE_SHA256: 8bd738851b524885410112678e3771b341c5c716de60fbbecb88ab0a363ed85d
    steps:
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            6.0.x
            9.0.x
      - name: Resolve release metadata
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $plan = $env:DIST_PLAN | ConvertFrom-Json
          $release = @($plan.releases | Where-Object { $_.app_name -eq "ttrackii-cli" })
          if ($release.Count -ne 1) {
            throw "Expected exactly one ttrackii-cli release in the cargo-dist plan."
          }
          $msi = @($release[0].artifacts | Where-Object { $_ -match '\.msi$' })
          if ($msi.Count -ne 1) {
            throw "Expected exactly one MSI artifact in the cargo-dist plan."
          }
          $github = $release[0].hosting.github
          if (-not $github) {
            throw "The cargo-dist plan does not contain GitHub release hosting metadata."
          }
          $installerUrl = "$($github.artifact_base_url)$($github.artifact_download_path)/$($msi[0])"
          $releaseUrl = "$($github.artifact_base_url)$($github.artifact_download_path.Replace('/download/', '/tag/'))"
          "version=$($release[0].app_version)" >> $env:GITHUB_OUTPUT
          "installer-url=$installerUrl" >> $env:GITHUB_OUTPUT
          "release-url=$releaseUrl" >> $env:GITHUB_OUTPUT
      - name: Check for an existing manifest or pull request
        id: existing
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_GITHUB_TOKEN)) {
            throw "WINGET_TOKEN is not configured in the winget GitHub environment."
          }
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:WINGET_CREATE_GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $manifestPath = "manifests/t/ttrackii/ttrackii/$env:VERSION"
          $manifestUri = "https://api.github.com/repos/microsoft/winget-pkgs/contents/$manifestPath"
          try {
            Invoke-RestMethod -Uri $manifestUri -Headers $headers | Out-Null
            "skip=true" >> $env:GITHUB_OUTPUT
            "reason=WinGet already contains $env:PACKAGE_IDENTIFIER $env:VERSION." >> $env:GITHUB_OUTPUT
            exit 0
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }
          $query = [uri]::EscapeDataString("repo:microsoft/winget-pkgs is:pr is:open in:title `"$env:PACKAGE_IDENTIFIER`" `"$env:VERSION`"")
          $result = Invoke-RestMethod -Uri "https://api.github.com/search/issues?q=$query" -Headers $headers
          if ($result.total_count -gt 0) {
            "skip=true" >> $env:GITHUB_OUTPUT
            "reason=An open WinGet pull request already targets $env:PACKAGE_IDENTIFIER $env:VERSION." >> $env:GITHUB_OUTPUT
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }
      - name: Report existing submission
        if: ${{ steps.existing.outputs.skip == 'true' }}
        shell: pwsh
        env:
          REASON: ${{ steps.existing.outputs.reason }}
        run: Write-Host $env:REASON
      - name: Download and verify WingetCreate
        if: ${{ steps.existing.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri $env:WINGETCREATE_URL -OutFile wingetcreate.exe
          $digest = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne $env:WINGETCREATE_SHA256) {
            throw "WingetCreate SHA-256 mismatch."
          }
          .\wingetcreate.exe info
      - name: Submit WinGet manifest update
        if: ${{ steps.existing.outputs.skip != 'true' }}
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
          INSTALLER_URL: ${{ steps.release.outputs.installer-url }}
          RELEASE_URL: ${{ steps.release.outputs.release-url }}
        run: |
          $ErrorActionPreference = "Stop"
          .\wingetcreate.exe update $env:PACKAGE_IDENTIFIER `
            --urls "$env:INSTALLER_URL|x64|machine" `
            --version $env:VERSION `
            --release-notes-url $env:RELEASE_URL `
            --submit
