name: Publish crates.io

on:
  workflow_call:
    inputs:
      plan:
        description: cargo-dist release plan
        required: true
        type: string

jobs:
  publish:
    name: Publish ttrackii-cli
    runs-on: ubuntu-22.04
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      DIST_PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - name: Check release version
        shell: bash
        run: |
          set -euo pipefail
          planned="$(jq -r '.releases[] | select(.app_name == "ttrackii-cli") | .app_version' <<< "$DIST_PLAN")"
          manifest="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "ttrackii-cli") | .version')"
          test "$planned" = "$manifest"
      - name: Publish crate
        run: cargo publish --locked
