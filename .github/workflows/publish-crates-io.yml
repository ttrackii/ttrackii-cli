name: Publish crates.io

on:
  workflow_call:
    inputs:
      plan:
        description: cargo-dist release plan
        required: true
        type: string

jobs:
  publish:
    name: Publish ttrackii-cli
    runs-on: ubuntu-22.04
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      DIST_PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Check release version
        shell: bash
        run: |
          set -euo pipefail
          planned="$(jq -r '.releases[] | select(.app_name == "ttrackii-cli") | .app_version' <<< "$DIST_PLAN")"
          manifest="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "ttrackii-cli") | .version')"
          test "$planned" = "$manifest"
      - name: Publish crate
        run: cargo publish --locked
