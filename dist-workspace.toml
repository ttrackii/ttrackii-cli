[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "powershell", "homebrew", "msi"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
unix-archive = ".tar.gz"
windows-archive = ".zip"
checksum = "sha256"
install-path = "CARGO_HOME"
install-updater = false
include = ["THIRD_PARTY_LICENSES.md"]
github-attestations = true
pr-run-mode = "plan"
display-name = "ttrackii"
tap = "ttrackii/homebrew-tap"
formula = "ttrackii"
global-artifacts-jobs = ["./linux-packages"]
publish-jobs = ["homebrew", "./publish-crates-io"]
# WinGet is off until the first manifest is submitted manually (see RELEASING.md):
# add `post-announce-jobs = ["./publish-winget"]` and its permissions entry back.
# Windows binaries are unsigned until an SSL.com eSigner certificate exists:
# add `ssldotcom-windows-sign = "prod"` back.
github-custom-job-permissions = { "publish-crates-io" = { contents = "read" } }

[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"

# Pin third-party actions in the generated release workflow to commit SHAs.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
